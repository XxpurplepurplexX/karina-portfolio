<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Una raccolta di storie d'amore raccontate da Karina, fotografa di matrimoni.">
  <title>Galleria — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Ctext x='32' y='32' dominant-baseline='central' text-anchor='middle' font-family='Georgia%2Cserif' font-size='46' fill='%23FFFFFF'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #000000;
      --white: #FFFFFF;
      --muted: #bdbdbd;
      --serif: "Viaoda Libre", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --script: "Pinyon Script", cursive;
    }

    * { box-sizing: border-box; }
      img { max-width: 100%; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .navigation {
      display: flex;
      justify-content: center;
      padding: 32px 7vw;
    }

    .navigation ul {
      display: flex;
      align-items: center;
      gap: clamp(24px, 5vw, 72px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .navigation a {
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: opacity .2s ease;
    }

    .navigation a:hover,
    .navigation a:focus-visible { opacity: .62; }

    .navigation a[aria-current="page"] { border-bottom: 1px solid var(--white); padding-bottom: 5px; }

    .nav-toggle { display: none; }

    .menu-open { overflow: hidden; }

    main { padding: clamp(48px, 8vw, 96px) 7vw 0; }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 34px;
      border-bottom: 1px solid #3a3a3a;
      padding-bottom: 18px;
      animation: fade-in .65s ease both;
    }

    .page-heading h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(46px, 8vw, 92px);
      font-weight: 400;
      line-height: .95;
    }

    .page-heading p {
      margin: 0 0 5px;
      color: var(--muted);
      font-family: var(--script);
      font-size: clamp(25px, 4vw, 38px);
    }

    .gallery {
      columns: 4;
      column-gap: 18px;
    }

    .gallery-item {
      display: block;
      width: 100%;
      margin: 0 0 18px;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: var(--black);
      cursor: zoom-in;
      break-inside: avoid;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      filter: grayscale(100%);
      transition: opacity .35s ease, transform .65s cubic-bezier(.2, .7, .2, 1);
    }

    .gallery-item:hover img,
    .gallery-item:focus-visible img { opacity: .76; transform: scale(1.025); }

    .gallery-item:focus-visible { outline: 1px solid var(--white); outline-offset: 4px; }

    footer {
      display: flex;
      justify-content: space-between;
      margin: 80px 7vw 0;
      border-top: 1px solid #3a3a3a;
      padding: 20px 0 24px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      border: 0;
      padding: 68px 80px;
      overflow: hidden;
      background: rgba(0, 0, 0, .96);
      color: var(--white);
      opacity: 0;
      transition: opacity .3s ease, overlay .3s allow-discrete, display .3s allow-discrete;
    }

    .lightbox[open] { display: grid; opacity: 1; }
    .lightbox::backdrop { background: rgba(0, 0, 0, .96); }
    .lightbox[open]::backdrop { animation: fade-in .3s ease both; }

    @starting-style {
      .lightbox[open] { opacity: 0; }
    }

    .lightbox-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: grayscale(100%);
      animation: fade-in .3s ease both;
    }

    .lightbox-control {
      position: absolute;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--white);
      cursor: pointer;
      transition: opacity .2s ease;
    }

    .lightbox-control:hover { opacity: .6; }
    .lightbox-control:focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }

    .lightbox-close { top: 18px; right: 20px; font-family: var(--sans); font-size: 34px; font-weight: 300; line-height: 1; }
    .lightbox-prev { top: 50%; left: 18px; transform: translateY(-50%); }
    .lightbox-next { top: 50%; right: 18px; transform: translateY(-50%); }
    .lightbox-control svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.2; }

    .has-scroll-reveal [data-reveal],
    .has-scroll-reveal .gallery-item {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1);
    }

    .has-scroll-reveal [data-reveal].is-visible,
    .has-scroll-reveal .gallery-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 20;
      display: grid;
      width: 48px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--white);
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s, background-color .2s ease, color .2s ease;
    }

    .back-to-top.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition: opacity .25s ease, transform .25s ease, visibility 0s, background-color .2s ease, color .2s ease;
    }

    .back-to-top:hover,
    .back-to-top:focus-visible { background: var(--black); color: var(--white); }

    .back-to-top:focus-visible { outline: 1px solid var(--white); outline-offset: 4px; }

    .back-to-top svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1000px) {
      .gallery { columns: 3; }
    }

    @media (max-width: 700px) {
      .navigation {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 0;
        pointer-events: none;
      }
      .navigation.is-open { pointer-events: auto; }
      .navigation ul {
        position: absolute;
        inset: 0;
        z-index: 1;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        width: 100%;
        height: 100%;
        padding: 76px 24px;
        background: var(--black);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-14px);
        transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
      }
      .navigation.is-open ul {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
        transition: opacity .35s ease, transform .35s ease, visibility 0s;
      }
      .navigation a { font-size: 18px; letter-spacing: .16em; }
      .nav-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2;
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--white);
        font: 400 28px/1 var(--sans);
        cursor: pointer;
        pointer-events: auto;
        transition: opacity .2s ease;
      }
      .nav-toggle:hover { opacity: .65; }
      .nav-toggle:focus-visible { outline: 1px solid var(--white); outline-offset: -4px; }
      main { padding: 50px 20px 0; }
      .page-heading { align-items: start; flex-direction: column; gap: 10px; margin-bottom: 25px; }
      .gallery { columns: 2; column-gap: 12px; }
      .gallery-item { margin-bottom: 12px; }
      footer { margin: 64px 20px 0; gap: 15px; font-size: 9px; }
      .lightbox { padding: 64px 12px; }
      .lightbox-prev { left: 2px; }
      .lightbox-next { right: 2px; }
    }

    @media (max-width: 380px) {
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
      .navigation ul { transition-delay: 0s !important; }
    }
  </style>
</head>
<body id="top">
  <header>
    <nav class="navigation" aria-label="Navigazione principale">
      <button class="nav-toggle" type="button" aria-label="Apri menu" aria-expanded="false" aria-controls="site-menu">☰</button>
      <ul id="site-menu">
        <li><a href="./index.html#home">Home</a></li>
        <li><a href="./gallery.html#gallery" aria-current="page">Galleria</a></li>
        <li><a href="./about.html">Chi sono</a></li>
        <li><a href="./contact.html">Contatti</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-heading">
      <h1>Galleria</h1>
      <p>Momenti da ricordare</p>
    </div>
    <section class="gallery" id="gallery" aria-label="Fotografie di matrimonio">
      <button class="gallery-item" type="button" aria-label="Apri fotografia 1">

        <img src="https://picsum.photos/seed/karina-wedding-05/900/1200" alt="Fotografia di matrimonio 5" loading="lazy">

      </button>

        <img src="https://picsum.photos/seed/karina-wedding-08/900/740" alt="Fotografia di matrimonio 8" loading="lazy">

      </button>

        <img src="https://picsum.photos/seed/karina-wedding-12/900/760" alt="Fotografia di matrimonio 12" loading="lazy">
      </button>
    </section>
  </main>

  <footer>
    <span>© Karina · Fotografia</span>
    <a href="index.html">Torna alla home</a>
  </footer>

  <dialog class="lightbox" aria-label="Visualizzatore immagini">
    <button class="lightbox-control lightbox-close" type="button" aria-label="Chiudi lightbox">×</button>
    <button class="lightbox-control lightbox-prev" type="button" aria-label="Fotografia precedente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
    </button>
    <img class="lightbox-image" alt="">
    <button class="lightbox-control lightbox-next" type="button" aria-label="Fotografia successiva">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </button>
  </dialog>

  <a class="back-to-top" href="#top" aria-label="Torna all'inizio" title="Torna all'inizio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
  </a>

  <script>
    const galleryItems = [...document.querySelectorAll('.gallery-item')];
    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = document.querySelector('.lightbox-image');
    let activeIndex = 0;

    function showImage(index) {
      activeIndex = (index + galleryItems.length) % galleryItems.length;
      const source = galleryItems[activeIndex].querySelector('img');
      lightboxImage.src = source.src;
      lightboxImage.alt = source.alt;
    }

    galleryItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        showImage(index);
        lightbox.showModal();
      });
    });

    document.querySelector('.lightbox-close').addEventListener('click', () => lightbox.close());
    document.querySelector('.lightbox-prev').addEventListener('click', () => showImage(activeIndex - 1));
    document.querySelector('.lightbox-next').addEventListener('click', () => showImage(activeIndex + 1));

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) lightbox.close();
    });

    lightbox.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showImage(activeIndex - 1);
      if (event.key === 'ArrowRight') showImage(activeIndex + 1);
    });

    const revealTargets = document.querySelectorAll('[data-reveal], .gallery-item');

    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('has-scroll-reveal');
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -32px 0px' });

      revealTargets.forEach((target) => revealObserver.observe(target));
    }

    const backToTop = document.querySelector('.back-to-top');
    const updateBackToTop = () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const triggerPoint = maxScroll > 400 ? 400 : Math.max(0, maxScroll - 24);
      backToTop.classList.toggle('is-visible', maxScroll > 0 && (maxScroll > 400 ? window.scrollY > triggerPoint : window.scrollY >= triggerPoint));
    };
    window.addEventListener('scroll', updateBackToTop, { passive: true });
    window.addEventListener('resize', updateBackToTop);
    updateBackToTop();

    const navigation = document.querySelector('.navigation');
    const menuToggle = navigation.querySelector('.nav-toggle');
    const menuLinks = navigation.querySelectorAll('a');

    function setMenuOpen(isOpen) {
      navigation.classList.toggle('is-open', isOpen);
      document.body.classList.toggle('menu-open', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'Chiudi menu' : 'Apri menu');
      menuToggle.textContent = isOpen ? '×' : '☰';
      if (isOpen) menuLinks[0].focus({ preventScroll: true });
      else menuToggle.focus({ preventScroll: true });
    }

    menuToggle.addEventListener('click', () => setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true'));
    menuLinks.forEach((link) => link.addEventListener('click', () => {
      if (navigation.classList.contains('is-open')) setMenuOpen(false);
    }));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && navigation.classList.contains('is-open')) setMenuOpen(false);
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 700 && navigation.classList.contains('is-open')) {
        navigation.classList.remove('is-open');
        document.body.classList.remove('menu-open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'Apri menu');
        menuToggle.textContent = '☰';
      }
    });
  </script>
</body>
</html>
