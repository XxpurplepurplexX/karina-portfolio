<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Contatta Karina per raccontare la vostra storia attraverso la fotografia di matrimonio.">
  <title>Contatti — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Ctext x='32' y='32' dominant-baseline='central' text-anchor='middle' font-family='Georgia%2Cserif' font-size='46' fill='%23FFFFFF'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #000000;
      --white: #FFFFFF;
      --muted: rgba(255, 255, 255, .48);
      --serif: "Viaoda Libre", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --script: "Pinyon Script", cursive;
    }

    * { box-sizing: border-box; }
      img { max-width: 100%; }
    html { scroll-behavior: smooth; }
    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .navigation {
      display: flex;
      justify-content: center;
      padding: 32px 7vw;
    }

    .navigation ul {
      display: flex;
      align-items: center;
      gap: clamp(24px, 5vw, 72px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .navigation a {
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: opacity .2s ease;
    }

    .navigation a:hover,
    .navigation a:focus-visible { opacity: .62; }

    .navigation a[aria-current="page"] { border-bottom: 1px solid var(--white); padding-bottom: 5px; }

    .nav-toggle { display: none; }

    .menu-open { overflow: hidden; }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 72px 24px 104px;
    }

    .contact-content {
      width: min(100%, 560px);
      margin: 0 auto;
      animation: fade-in .7s ease both;
    }

    .heading {
      margin-bottom: 50px;
      text-align: center;
    }

    .heading h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(48px, 8vw, 78px);
      font-weight: 400;
      line-height: 1;
    }

    .heading p {
      margin: 12px 0 0;
      font-family: var(--script);
      font-size: 34px;
      line-height: 1.2;
    }

    .contact-form { display: grid; gap: 32px; }

    .field {
      display: grid;
      gap: 11px;
    }

    .field label {
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--white);
      border-radius: 0;
      padding: 12px 0 15px;
      background: transparent;
      color: var(--white);
      font: 400 15px/1.6 var(--sans);
      outline: none;
      transition: border-color .2s ease;
    }

    .field textarea {
      min-height: 118px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder { color: var(--muted); opacity: 1; }

    .field input:focus,
    .field textarea:focus { border-bottom-width: 2px; }

    .submit-button {
      justify-self: center;
      min-width: 174px;
      margin-top: 8px;
      border: 1px solid var(--white);
      padding: 15px 28px;
      background: var(--white);
      color: var(--black);
      font: 500 10px/1.2 var(--sans);
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .25s ease, color .25s ease;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: var(--black);
      color: var(--white);
    }

    .submit-button:focus-visible { outline: 1px solid var(--white); outline-offset: 4px; }

    .success-message {
      min-height: 1.5em;
      margin: 25px 0 0;
      font-family: var(--script);
      font-size: 29px;
      text-align: center;
    }

    .success-message:empty { display: none; }

    .social-link {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      margin: 40px auto 0;
      transition: opacity .2s ease;
    }

    .social-link:hover,
    .social-link:focus-visible { opacity: .62; }

    .social-link svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .has-scroll-reveal [data-reveal] {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1);
    }

    .has-scroll-reveal [data-reveal].is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 20;
      display: grid;
      width: 48px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--white);
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s, background-color .2s ease, color .2s ease;
    }

    .back-to-top.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition: opacity .25s ease, transform .25s ease, visibility 0s, background-color .2s ease, color .2s ease;
    }

    .back-to-top:hover,
    .back-to-top:focus-visible { background: var(--black); color: var(--white); }

    .back-to-top:focus-visible { outline: 1px solid var(--white); outline-offset: 4px; }

    .back-to-top svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; }

    footer {
      display: flex;
      justify-content: space-between;
      margin: 0 7vw;
      border-top: 1px solid #3a3a3a;
      padding: 20px 0 24px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .navigation {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 0;
        pointer-events: none;
      }
      .navigation.is-open { pointer-events: auto; }
      .navigation ul {
        position: absolute;
        inset: 0;
        z-index: 1;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        width: 100%;
        height: 100%;
        padding: 76px 24px;
        background: var(--black);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-14px);
        transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
      }
      .navigation.is-open ul {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
        transition: opacity .35s ease, transform .35s ease, visibility 0s;
      }
      .navigation a { font-size: 18px; letter-spacing: .16em; }
      .nav-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2;
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--white);
        font: 400 28px/1 var(--sans);
        cursor: pointer;
        pointer-events: auto;
        transition: opacity .2s ease;
      }
      .nav-toggle:hover { opacity: .65; }
      .nav-toggle:focus-visible { outline: 1px solid var(--white); outline-offset: -4px; }
      main { padding: 60px 24px 80px; }
      .heading { margin-bottom: 40px; }
      .contact-form { gap: 26px; }
      footer { margin: 0 20px; gap: 15px; font-size: 9px; }
    }

    @media (max-width: 380px) {
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
      .navigation ul { transition-delay: 0s !important; }
    }
  </style>
</head>
<body id="top">
  <header>
    <nav class="navigation" aria-label="Navigazione principale">
      <button class="nav-toggle" type="button" aria-label="Apri menu" aria-expanded="false" aria-controls="site-menu">☰</button>
      <ul id="site-menu">
        <li><a href="./index.html#home">Home</a></li>
        <li><a href="./gallery.html">Galleria</a></li>
        <li><a href="./about.html">Chi sono</a></li>
        <li><a href="./contact.html#contact" aria-current="page">Contatti</a></li>
      </ul>
    </nav>
  </header>

  <main id="contact">
    <section class="contact-content" aria-labelledby="contact-title">
      <div class="heading">
        <h1 id="contact-title">Scrivimi</h1>
        <p>La vostra storia comincia qui</p>
      </div>

      <form class="contact-form">
        <div class="field">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" placeholder="Il tuo nome" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="La tua e-mail" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Messaggio</label>
          <textarea id="message" name="message" placeholder="Raccontami qualcosa di voi..." required></textarea>
        </div>
        <button class="submit-button" type="submit">Invia il messaggio</button>
      </form>
      <p class="success-message" aria-live="polite" role="status"></p>

      <a class="social-link" href="https://www.instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram" data-reveal>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.7" cy="6.6" r=".8" fill="currentColor" stroke="none" />
        </svg>
      </a>
    </section>
  </main>

  <footer>
    <span>© Karina · Fotografia</span>
    <a href="index.html">Torna alla home</a>
  </footer>
  <a class="back-to-top" href="#top" aria-label="Torna all'inizio" title="Torna all'inizio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
  </a>

  <script>
    const contactForm = document.querySelector('.contact-form');
    const successMessage = document.querySelector('.success-message');

    contactForm.addEventListener('submit', (event) => {
      event.preventDefault();
      successMessage.textContent = 'Grazie. Ti ricontatterò presto.';
      contactForm.reset();
    });

    const revealTargets = document.querySelectorAll('[data-reveal]');

    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('has-scroll-reveal');
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -32px 0px' });

      revealTargets.forEach((target) => revealObserver.observe(target));
    }

    const backToTop = document.querySelector('.back-to-top');
    const updateBackToTop = () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const triggerPoint = maxScroll > 400 ? 400 : Math.max(0, maxScroll - 24);
      backToTop.classList.toggle('is-visible', maxScroll > 0 && (maxScroll > 400 ? window.scrollY > triggerPoint : window.scrollY >= triggerPoint));
    };
    window.addEventListener('scroll', updateBackToTop, { passive: true });
    window.addEventListener('resize', updateBackToTop);
    updateBackToTop();

    const navigation = document.querySelector('.navigation');
    const menuToggle = navigation.querySelector('.nav-toggle');
    const menuLinks = navigation.querySelectorAll('a');

    function setMenuOpen(isOpen) {
      navigation.classList.toggle('is-open', isOpen);
      document.body.classList.toggle('menu-open', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'Chiudi menu' : 'Apri menu');
      menuToggle.textContent = isOpen ? '×' : '☰';
      if (isOpen) menuLinks[0].focus({ preventScroll: true });
      else menuToggle.focus({ preventScroll: true });
    }

    menuToggle.addEventListener('click', () => setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true'));
    menuLinks.forEach((link) => link.addEventListener('click', () => {
      if (navigation.classList.contains('is-open')) setMenuOpen(false);
    }));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && navigation.classList.contains('is-open')) setMenuOpen(false);
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 700 && navigation.classList.contains('is-open')) {
        navigation.classList.remove('is-open');
        document.body.classList.remove('menu-open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'Apri menu');
        menuToggle.textContent = '☰';
      }
    });
  </script>
</body>
</html>
